<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenLayers Web App</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@9.2.4/ol.css">
    <script src="https://cdn.jsdelivr.net/npm/ol@9.2.4/dist/ol.js"></script>
</head>
<body>

<div id="app">
    <aside id="sidebar">
        <div id="title">
            <h1>OpenLayers Web App</h1>
            <button id="closeSidebar" title="Close Sidebar">X</button>
        </div>
       <div id="manualLocation">
            <label>Longitude</label>
            <input type="text" id="longitude" placeholder="e.g. 23.7275">
            <label>Latitude</label>
            <input type="text" id="latitude" placeholder="e.g. 37.9838">
            <button id="manualLocationButton">+ Add Location</button>
            <p id="locationError" class="error-msg"></p>
        </div>

        <div class="listButtons">
            <button id="selectAllButton" disabled>Select All</button>
            <button id="unselectAllButton" disabled>Unselect All</button>
            <button id="clearListButton">Clear List</button>
        </div>

        <div id="locations-section">
            <h2>Locations:</h2>
            <p id="locations-hint">Click to select - Drag to reorder</p>
            <p id="trips"></p>
            <ul id="locations"></ul>
        </div>
        <button id="calculateRoute">Calculate Route</button>
        <p id="routeError" class="error-msg"></p>
        <div id="footer">
            Made by Grigoris Papadopoulos
        </div>
    </aside>
    <main id="map-container">
        <div id="map"></div>
        <button id="openSidebar" class="hidden" title="Open Sidebar">☰</button>
    </main>
</div>
    

<script src="app.js"></script>
</body>
</html>
